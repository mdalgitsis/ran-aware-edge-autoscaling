---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Yamllint
        run: yamllint .

      - name: Pytest
        run: pytest -q

      - name: End-to-end demo must deploy, scale and undeploy
        run: |
          python -m autoscaler.demo | tee /tmp/demo.log
          grep -q deploy /tmp/demo.log
          grep -q scale /tmp/demo.log
          grep -q undeploy /tmp/demo.log

  studies:
    name: Reproduce the paper's studies
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-plot.txt

      # Reduced iterations: this checks the studies still run and emit their
      # artefacts, not that the published numbers are hit to the decimal.
      - name: Migration impact
        run: |
          python -m studies.migration_impact --iterations 50 --output-dir /tmp/out
          test -s /tmp/out/migration_results.csv
          test -s /tmp/out/users_affected_migration_comparison.pdf

      - name: Energy efficiency
        env:
          OUTPUT_DIR: /tmp/out
        run: |
          python studies/energy_efficiency.py
          test -s /tmp/out/energy_reduction_log.json
          test -s /tmp/out/energy_reduction_comparison.pdf

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Lint
        run: helm lint charts/ue-simulator charts/autoscaler

      # Rendering only the defaults leaves every conditional untested.
      - name: Render every conditional branch
        run: |
          helm template t charts/ue-simulator > /dev/null
          helm template t charts/ue-simulator --set serviceMonitor.enabled=false > /dev/null
          helm template t charts/autoscaler > /dev/null
          helm template t charts/autoscaler --set serviceMonitor.enabled=false > /dev/null
          helm template t charts/autoscaler --set rbac.create=false --set serviceAccount.create=false > /dev/null
          helm template t charts/autoscaler --set loop.dryRun=true --set workload.namespace=apps > /dev/null
          helm template t charts/autoscaler --set 'imagePullSecrets[0].name=regcred' > /dev/null

      - name: The autoscaler must never be granted delete on Deployments
        run: |
          if helm template t charts/autoscaler | grep -A4 '"deployments"' | grep -q 'delete'; then
            echo "RBAC grants delete; undeploy is meant to be scale-to-zero"
            exit 1
          fi

      - name: Validate rendered manifests
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          for chart in ue-simulator autoscaler; do
            helm template t "charts/$chart" \
              | ./kubeconform -strict -ignore-missing-schemas -summary
          done

  operator:
    name: Operator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: operator/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Generated manifests must be up to date
        run: |
          make manifests generate
          if ! git diff --exit-code -- config/ api/; then
            echo "Regenerate with 'make manifests generate' and commit the result"
            exit 1
          fi

      - name: Test
        run: make test

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker build -f docker/ue-simulator.Dockerfile -t ue-simulator:ci .
          docker build -f docker/autoscaler.Dockerfile -t autoscaler:ci .

      # The telemetry source must come up, export and stop on its own.
      - name: Smoke-test the telemetry source
        run: |
          docker run --rm -e MAX_CYCLES=1 -e SIMULATION_STEP=0 \
            -e IDLE_PERIOD=2 -e RAMP_PERIOD=4 \
            ue-simulator:ci 2>&1 | tee /tmp/sim.log
          grep -q "Reached MAX_CYCLES=1" /tmp/sim.log

      # With no Prometheus reachable the loop must hold, not crash and not act.
      - name: Autoscaler must degrade safely with no Prometheus
        run: |
          docker run --rm -e MAX_ITERATIONS=2 -e RECONCILE_INTERVAL=0 \
            -e PROMETHEUS_URL=http://127.0.0.1:1 -e DRY_RUN=true \
            autoscaler:ci 2>&1 | tee /tmp/as.log
          grep -q "Holding:" /tmp/as.log
          grep -q "Reached MAX_ITERATIONS=2" /tmp/as.log

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
