---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ue-simulator.fullname" . }}
  labels:
    {{- include "ue-simulator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ue-simulator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: metrics
