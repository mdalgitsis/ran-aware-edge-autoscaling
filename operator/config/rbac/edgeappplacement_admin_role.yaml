# This rule is not used by the project kafkanotify-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over edge.ranaware.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kafkanotify-operator
    app.kubernetes.io/managed-by: kustomize
  name: edgeappplacement-admin-role
rules:
- apiGroups:
  - edge.ranaware.dev
  resources:
  - edgeappplacements
  verbs:
  - '*'
- apiGroups:
  - edge.ranaware.dev
  resources:
  - edgeappplacements/status
  verbs:
  - get
