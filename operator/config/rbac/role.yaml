---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - edge.ranaware.dev
  resources:
  - edgeappplacements
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - edge.ranaware.dev
  resources:
  - edgeappplacements/finalizers
  verbs:
  - update
- apiGroups:
  - edge.ranaware.dev
  resources:
  - edgeappplacements/status
  verbs:
  - get
  - patch
  - update
